services:
  php:
    image: wodby/php:${PHP_VERSION}
    working_dir: /srv/web
    container_name: templater-php
    volumes:
      - .:/srv/web
      - ./dev/php.ini:/usr/local/etc/php/conf.d/z-php-sp-overrides.ini
    environment:
      XDEBUG_CONFIG: client_host=host.docker.internal
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      PHP_XDEBUG: 1
      PHP_XDEBUG_DEFAULT_ENABLE: 0
      PHP_IDE_CONFIG: ${XDEBUG_IDE_CONFIG:-}
      PHP_XDEBUG_CLIENT_PORT: ${XDEBUG_PORT:-9019}
      PHP_XDEBUG_IDEKEY: ${XDEBUG_IDE_KEY:-PHPSTORM}
      PHP_EXTENSIONS_DISABLE: ${EXTENSIONS_DISABLE:-}
    ports:
      - "9000:9000"
    networks:
        - itron-network

networks:
  itron-network:
    driver: bridge
